<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — College Attendance System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body class="h-full bg-gray-950 flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg">
        <i class="fas fa-camera text-white text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white">FaceAttend</h1>
      <p class="text-gray-400 text-sm mt-1">College Face Recognition Attendance System</p>
    </div>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="mb-4 space-y-2">
      {% for cat, msg in messages %}
      <div class="px-4 py-3 rounded-lg text-sm
        {% if cat == 'danger' %}bg-red-900/50 border border-red-700 text-red-300
        {% elif cat == 'warning' %}bg-yellow-900/50 border border-yellow-700 text-yellow-300
        {% else %}bg-blue-900/50 border border-blue-700 text-blue-300{% endif %}">
        {{ msg }}
      </div>
      {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <!-- Login form -->
    <div class="bg-gray-800 rounded-2xl border border-gray-700 p-8 shadow-2xl">
      <h2 class="text-lg font-semibold text-white mb-6">Sign in to your account</h2>
      <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Username</label>
          <div class="relative">
            <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
            <input type="text" name="username" required autofocus
              class="w-full bg-gray-900 border border-gray-700 rounded-lg pl-10 pr-4 py-2.5 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter your username"/>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
            <input type="password" name="password" required
              class="w-full bg-gray-900 border border-gray-700 rounded-lg pl-10 pr-4 py-2.5 text-white text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter your password"/>
          </div>
        </div>
        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-gray-600 mt-6">
      Default Super Admin: <code class="text-gray-400">superadmin / Admin@123</code>
    </p>
  </div>
</body>
</html>
